services:
  hnode:
    container_name: hnode
    image: "hnode:${TAG:-latest}"
    network_mode: host
    build:
      context: "."
      dockerfile: Dockerfile
    mem_limit: 4GB
    tty: true
    environment:
      PRIVATE_KEY: ${ETH_PRIVATE_KEY}
      MINING_INTERVAL_MS: ${MINING_INTERVAL_MS:-100}
